<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e8eef7);
    }
    .card {
      width: min(92%, 520px);
      padding: 48px 28px;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,.12);
    }
    h1 {
      margin: 0 0 30px;
      font-size: clamp(30px, 7vw, 48px);
      color: #222;
    }
    .vote-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 78px;
      padding: 18px 28px;
      border: 0;
      border-radius: 16px;
      background: #1677ff;
      color: white;
      font-size: clamp(24px, 6vw, 34px);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(22,119,255,.28);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .vote-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 25px rgba(22,119,255,.35);
    }
    .vote-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <a class="vote-btn" href="https://agmlholding.com/max1year">Участвовать</a>
  </main>
</body>
</html>
